<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="index.css">

    <title>Document</title>
</head>

<body>

    <!-- Controle da abertura da carta -->
    <input type="checkbox" id="openCard">

    <label for="openCard" class="birthdayCard">

        <div class="cardFront">

            <div class="front-text">
                <h3 class="happy">FELIZ</h3>
                <h2 class="bday">ANIVERSÁRIO</h2>
                <h3 class="toyou">Kelly!</h3>
            </div>

            <div class="wrap-deco">
                <div class="decorations"></div>
                <div class="decorationsTwo"></div>
            </div>

            <div class="wrap-decoTwo">
                <div class="decorations"></div>
                <div class="decorationsThree"></div>
            </div>

            <div class="plate">
                <div class="cake"></div>
                <div class="flame"></div>
            </div>

        </div>

        <div class="cardInside">

            <div class="inside-text">
                <h3 class="happy">FELIZ</h3>
                <h2 class="bday">ANIVERSÁRIO</h2>
                <h3 class="toyou">Kelly!</h3>
            </div>

            <div class="wishes">
                <p>Querida Kelly,</p>

                <p>
                    Feliz aniversário!! Espero que seu dia seja preenchido
                    com muito amor e risadas!
                </p>

                <p class="name">Beijos!</p>
            </div>

        </div>

    </label>

</body>

</html>
